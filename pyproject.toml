[project]
name = "gcp-schools-warehouse"
version = "0.1.0"
description = "Wisconsin K-12 schools warehouse on GCS, BigQuery and Dataform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dataform/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
